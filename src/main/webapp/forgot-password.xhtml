<ui:composition template="/WEB-INF/templates/layout.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="jakarta.faces.html"
                 xmlns:f="jakarta.faces.core"
                 xmlns:ui="jakarta.faces.facelets">

    <ui:define name="content">
        <div class="login-wrapper">
            <div class="card login-card">
                <div class="login-brand">
                    <span class="brand-dot"></span>
                    <span class="login-brand-name">#{msg['app.name']}</span>
                    <ui:include src="/WEB-INF/templates/langSwitch.xhtml"/>
                </div>
                <h1>#{msg['reset.forgotTitle']}</h1>
                <h:panelGroup rendered="#{not passwordResetBean.requested}">
                    <p class="subtitle">#{msg['reset.forgotIntro']}</p>
                    <h:form>
                        <div class="form-row">
                            <h:outputLabel for="email" value="#{msg['common.email']}"/>
                            <h:inputText id="email" value="#{passwordResetBean.email}" required="true"
                                         requiredMessage="#{msg['err.credentialsRequired']}"/>
                        </div>
                        <h:commandButton styleClass="btn" value="#{msg['reset.send']}" action="#{passwordResetBean.request}"/>
                    </h:form>
                </h:panelGroup>
                <h:panelGroup rendered="#{passwordResetBean.requested}">
                    <p class="subtitle">#{msg['reset.sent']}</p>
                </h:panelGroup>
                <p class="login-footer"><h:link value="#{msg['reset.backToLogin']}" outcome="/login"/></p>
            </div>
        </div>
    </ui:define>
</ui:composition>
