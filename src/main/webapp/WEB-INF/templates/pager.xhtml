<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets">
    <!-- Pagination d'une liste (paramètre : bean). Les liens gardent q et status (includeViewParams). -->
    <h:panelGroup layout="block" styleClass="pager" rendered="#{bean.pageData.total gt 0}">
        <span class="pager-count">
            <h:outputFormat value="#{msg['list.range']}">
                <f:param value="#{bean.pageData.from}"/>
                <f:param value="#{bean.pageData.to}"/>
                <f:param value="#{bean.pageData.total}"/>
            </h:outputFormat>
        </span>
        <h:panelGroup styleClass="pager-links" rendered="#{bean.pageData.paginated}">
            <h:link styleClass="btn btn-secondary btn-sm" value="‹ #{msg['list.previous']}" outcome="#{view.viewId}"
                    includeViewParams="true" disabled="#{not bean.pageData.hasPrevious}">
                <f:param name="page" value="#{bean.pageData.previousPage}"/>
            </h:link>
            <span class="pager-page">#{bean.pageData.page} / #{bean.pageData.pageCount}</span>
            <h:link styleClass="btn btn-secondary btn-sm" value="#{msg['list.next']} ›" outcome="#{view.viewId}"
                    includeViewParams="true" disabled="#{not bean.pageData.hasNext}">
                <f:param name="page" value="#{bean.pageData.nextPage}"/>
            </h:link>
        </h:panelGroup>
    </h:panelGroup>
</ui:composition>
