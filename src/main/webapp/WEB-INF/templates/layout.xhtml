<!DOCTYPE html>
<html lang="fr"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">
<h:head>
    <meta charset="UTF-8"/>
    <title><ui:insert name="title">QA Reporting</ui:insert></title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap"
          rel="stylesheet"/>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>
<h:body>
    <h:panelGroup rendered="#{sessionAuth.loggedIn}">
        <div class="app-shell">
            <ui:include src="/WEB-INF/templates/nav.xhtml"/>

            <div class="app-main">
                <div class="app-header">
                    <div class="app-search">
                        <span class="search-dot"></span>
                        <span class="search-placeholder">Rechercher un projet, une équipe, une anomalie...</span>
                    </div>
                    <div class="header-right">
                        <h:link styleClass="notif-bell" outcome="/app/notifications">
                            &#128276;
                            <h:panelGroup styleClass="notif-badge" layout="block"
                                          rendered="#{sessionAuth.unreadNotificationCount gt 0}">
                                #{sessionAuth.unreadNotificationCount}
                            </h:panelGroup>
                        </h:link>
                        <h:link styleClass="app-user" outcome="/app/profile">
                            <div class="avatar">#{sessionAuth.userInitials}</div>
                            <div class="app-user-text">
                                <div class="app-user-name">#{sessionAuth.userName}</div>
                                <div class="app-user-role">#{sessionAuth.roleName}</div>
                            </div>
                        </h:link>
                    </div>
                </div>

                <div class="messages">
                    <h:messages globalOnly="false" layout="table" errorClass="msg-error" infoClass="msg-info"/>
                </div>

                <div class="content">
                    <ui:insert name="content"/>
                </div>
            </div>
        </div>
    </h:panelGroup>

    <h:panelGroup rendered="#{!sessionAuth.loggedIn}">
        <div class="messages">
            <h:messages globalOnly="false" layout="table" errorClass="msg-error" infoClass="msg-info"/>
        </div>
        <div class="content">
            <ui:insert name="content"/>
        </div>
    </h:panelGroup>
</h:body>
</html>
