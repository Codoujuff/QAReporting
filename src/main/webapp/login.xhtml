<ui:composition template="/WEB-INF/templates/layout.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="jakarta.faces.html"
                 xmlns:f="jakarta.faces.core"
                 xmlns:ui="jakarta.faces.facelets">

    <f:metadata>
        <f:viewParam name="next" value="#{loginBean.next}"/>
    </f:metadata>

    <ui:define name="content">
        <div class="login-wrapper">
            <div class="card login-card">
                <div class="login-brand">
                    <span class="brand-dot"></span>
                    <span class="login-brand-name">#{msg['app.name']}</span>
                    <ui:include src="/WEB-INF/templates/langSwitch.xhtml"/>
                </div>
                <h1>#{msg['login.title']}</h1>
                <p class="subtitle">#{msg['login.tagline']}</p>
                <h:form>
                    <div class="form-row">
                        <h:outputLabel for="email" value="#{msg['common.email']}"/>
                        <h:inputText id="email" value="#{loginBean.email}" required="true"/>
                    </div>
                    <div class="form-row">
                        <h:outputLabel for="password" value="#{msg['common.password']}"/>
                        <h:inputSecret id="password" value="#{loginBean.password}" required="true"/>
                    </div>
                    <h:commandButton styleClass="btn" value="#{msg['login.submit']}" action="#{loginBean.login}"/>
                    <p class="login-footer"><h:link value="#{msg['reset.forgotLink']}" outcome="/forgot-password"/></p>
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
