<ui:composition template="/WEB-INF/templates/layout.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="jakarta.faces.html"
                 xmlns:f="jakarta.faces.core"
                 xmlns:ui="jakarta.faces.facelets">

    <f:metadata>
        <f:viewParam name="testId" value="#{defectFormBean.testId}"/>
        <f:viewParam name="executionId" value="#{defectFormBean.executionId}"/>
        <f:viewAction action="#{defectFormBean.load}"/>
    </f:metadata>

    <ui:define name="content">
        <h1>#{msg['defect.new']}</h1>
        <h:panelGroup layout="block" styleClass="callout" rendered="#{defectFormBean.sourceTest != null}">
            <div class="callout-text">
                #{msg['defect.fromTest.linked']}
                <h:link value="#{defectFormBean.sourceTest.title}" outcome="/app/tests/detail">
                    <f:param name="id" value="#{defectFormBean.sourceTest.id}"/>
                </h:link>
            </div>
        </h:panelGroup>

        <div class="card">
            <h:form>
                <div class="form-row">
                    <h:outputLabel for="title" value="#{msg['common.title']}"/>
                    <h:inputText id="title" value="#{defectFormBean.defect.title}" required="true"/>
                </div>
                <div class="form-row">
                    <h:outputLabel for="project" value="#{msg['common.project']}"/>
                    <h:selectOneMenu id="project" value="#{defectFormBean.projectId}">
                        <f:selectItem itemLabel="#{msg['common.choose']}" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{defectFormBean.projectOptions}" var="p"
                                       itemValue="#{p.id}" itemLabel="#{p.name}"/>
                    </h:selectOneMenu>
                </div>
                <div class="form-row">
                    <h:outputLabel for="severity" value="#{msg['common.severity']}"/>
                    <h:selectOneMenu id="severity" value="#{defectFormBean.defect.severity}">
                        <f:selectItems value="#{defectFormBean.severityOptions}" var="o" itemValue="#{o}" itemLabel="#{labels.of(o)}"/>
                    </h:selectOneMenu>
                </div>
                <div class="form-row">
                    <h:outputLabel for="priority" value="#{msg['common.priority']}"/>
                    <h:selectOneMenu id="priority" value="#{defectFormBean.defect.priority}">
                        <f:selectItems value="#{defectFormBean.priorityOptions}" var="o" itemValue="#{o}" itemLabel="#{labels.of(o)}"/>
                    </h:selectOneMenu>
                </div>
                <div class="form-row">
                    <h:outputLabel for="description" value="#{msg['common.description']}"/>
                    <h:inputTextarea id="description" value="#{defectFormBean.defect.description}"/>
                </div>
                <div class="form-row">
                    <h:outputLabel for="expected" value="#{msg['common.expectedResult']}"/>
                    <h:inputTextarea id="expected" value="#{defectFormBean.defect.expectedResult}"/>
                </div>
                <div class="form-row">
                    <h:outputLabel for="actual" value="#{msg['common.actualResult']}"/>
                    <h:inputTextarea id="actual" value="#{defectFormBean.defect.actualResult}"/>
                </div>
                <div class="form-row">
                    <h:outputLabel for="steps" value="#{msg['defect.steps']}"/>
                    <h:inputTextarea id="steps" value="#{defectFormBean.defect.reproductionSteps}"/>
                </div>
                <h:commandButton styleClass="btn" value="#{msg['common.create']}" action="#{defectFormBean.save}"/>
                <h:link styleClass="btn btn-secondary" value="#{msg['common.cancel']}" outcome="/app/defects/list"/>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
