<ui:composition template="/WEB-INF/templates/layout.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="jakarta.faces.html"
                 xmlns:f="jakarta.faces.core"
                 xmlns:ui="jakarta.faces.facelets">

    <f:metadata>
        <f:viewParam name="id" value="#{testFormBean.id}"/>
        <f:viewAction action="#{testFormBean.load}"/>
    </f:metadata>

    <ui:define name="content">
        <h1>#{testFormBean.id != null ? msg['test.edit'] : msg['test.new']}</h1>

        <div class="card">
            <h:form>
                <div class="form-row">
                    <h:outputLabel for="project" value="#{msg['common.project']}"/>
                    <h:selectOneMenu id="project" value="#{testFormBean.projectId}">
                        <f:selectItem itemLabel="#{msg['common.choose']}" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{testFormBean.projectOptions}" var="p"
                                       itemValue="#{p.id}" itemLabel="#{p.name}"/>
                    </h:selectOneMenu>
                </div>
                <div class="form-row">
                    <h:outputLabel for="title" value="#{msg['common.title']}"/>
                    <h:inputText id="title" value="#{testFormBean.test.title}" required="true"/>
                </div>
                <div class="form-row">
                    <h:outputLabel for="type" value="#{msg['common.type']}"/>
                    <h:inputText id="type" value="#{testFormBean.test.type}"/>
                </div>
                <div class="form-row">
                    <h:outputLabel for="campaign" value="#{msg['common.campaign']}"/>
                    <h:selectOneMenu id="campaign" value="#{testFormBean.campaignId}">
                        <f:selectItem itemLabel="#{msg['common.noneF']}" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{testFormBean.campaignOptions}" var="c"
                                       itemValue="#{c.id}" itemLabel="#{c.name}"/>
                    </h:selectOneMenu>
                </div>
                <div class="form-row">
                    <h:outputLabel for="environment" value="#{msg['common.environment']}"/>
                    <h:selectOneMenu id="environment" value="#{testFormBean.environmentId}">
                        <f:selectItem itemLabel="#{msg['common.noneM']}" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{testFormBean.environmentOptions}" var="e"
                                       itemValue="#{e.id}" itemLabel="#{e.name}"/>
                    </h:selectOneMenu>
                </div>
                <div class="form-row">
                    <h:outputLabel for="assignedTo" value="#{msg['common.assignedToM']}"/>
                    <h:selectOneMenu id="assignedTo" value="#{testFormBean.assignedToId}"
                                     disabled="#{not perm.assignTests}">
                        <f:selectItem itemLabel="#{msg['common.noneM']}" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{testFormBean.userOptions}" var="u"
                                       itemValue="#{u.id}" itemLabel="#{u.name}"/>
                    </h:selectOneMenu>
                    <h:outputText styleClass="field-hint" value="#{msg['test.assignHint']}"
                                  rendered="#{not perm.assignTests}"/>
                </div>
                <div class="form-row">
                    <h:outputLabel for="description" value="#{msg['common.description']}"/>
                    <h:inputTextarea id="description" value="#{testFormBean.test.description}"/>
                </div>
                <div class="form-row">
                    <h:outputLabel for="preconditions" value="#{msg['test.preconditions']}"/>
                    <h:inputTextarea id="preconditions" value="#{testFormBean.test.preconditions}"/>
                </div>
                <div class="form-row">
                    <h:outputLabel for="steps" value="#{msg['test.stepsPerLine']}"/>
                    <h:inputTextarea id="steps" value="#{testFormBean.stepsText}" rows="6"/>
                </div>
                <div class="form-row">
                    <h:outputLabel for="expectedResult" value="#{msg['common.expectedResult']}"/>
                    <h:inputTextarea id="expectedResult" value="#{testFormBean.test.expectedResult}"/>
                </div>

                <h:commandButton styleClass="btn" value="#{msg['common.save']}" action="#{testFormBean.save}"/>
                <h:link styleClass="btn btn-secondary" value="#{msg['common.cancel']}" outcome="/app/tests/list"/>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
