<ui:composition template="/WEB-INF/templates/layout.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="jakarta.faces.html"
                 xmlns:f="jakarta.faces.core"
                 xmlns:ui="jakarta.faces.facelets">

    <ui:define name="content">
        <h1>#{msg['nav.myTeam']}</h1>

        <h:panelGroup rendered="#{!dashboardBean.hasTeam}">
            <div class="card">
                <p class="empty-state">
                    #{msg['common.noTeam']}
                </p>
            </div>
        </h:panelGroup>

        <h:panelGroup rendered="#{dashboardBean.hasTeam}">
            <div class="card">
                <h:dataTable value="#{dashboardBean.teamMembers}" var="m" styleClass="data-table">
                    <h:column>
                        <f:facet name="header">#{msg['common.member']}</f:facet>
                        #{m.name}
                    </h:column>
                    <h:column>
                        <f:facet name="header">#{msg['common.assignedDefects']}</f:facet>
                        #{m.assignedCount}
                    </h:column>
                    <h:column>
                        <f:facet name="header">#{msg['common.createdDefects']}</f:facet>
                        #{m.createdCount}
                    </h:column>
                </h:dataTable>
                <h:panelGroup rendered="#{empty dashboardBean.teamMembers}">
                    <p class="empty-state">#{msg['common.noMemberYet']}</p>
                </h:panelGroup>
            </div>
        </h:panelGroup>
    </ui:define>
</ui:composition>
