<ui:composition template="/WEB-INF/templates/layout.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="jakarta.faces.html"
                 xmlns:f="jakarta.faces.core"
                 xmlns:ui="jakarta.faces.facelets">

    <ui:define name="content">
        <h1>#{msg['nav.settings']}</h1>

        <h:form>
            <div class="card">
                <h2>#{msg['settings.account']}</h2>
                <div class="form-row">
                    <label for="name">#{msg['common.name']}</label>
                    <h:inputText id="name" value="#{userSettingsBean.user.name}" required="true"/>
                </div>
                <div class="form-row">
                    <label for="email">#{msg['common.email']}</label>
                    <h:inputText id="email" value="#{userSettingsBean.user.email}" disabled="true"/>
                </div>
            </div>

            <div class="card">
                <h2>#{msg['nav.notifications']}</h2>
                <div class="form-row">
                    <label for="notifyAssigned">
                        <h:selectBooleanCheckbox id="notifyAssigned" value="#{userSettingsBean.user.notifyAssigned}"/>
                        #{msg['settings.notifAssigned']}
                    </label>
                </div>
                <div class="form-row">
                    <label for="notifyFixed">
                        <h:selectBooleanCheckbox id="notifyFixed" value="#{userSettingsBean.user.notifyFixed}"/>
                        #{msg['settings.notifFixed']}
                    </label>
                </div>
                <div class="form-row">
                    <label for="notifyCampaign">
                        <h:selectBooleanCheckbox id="notifyCampaign" value="#{userSettingsBean.user.notifyCampaign}"/>
                        #{msg['settings.notifCampaign']}
                    </label>
                </div>
            </div>

            <div class="card">
                <h2>#{msg['settings.reminder']}</h2>
                <p style="color:#5B6472;font-size:13px;margin-top:-8px;margin-bottom:16px;">
                    #{msg['settings.reminderIntro']}
                </p>
                <div class="form-row">
                    <label for="reminderEnabled">
                        <h:selectBooleanCheckbox id="reminderEnabled" value="#{userSettingsBean.reminderEnabled}"/>
                        #{msg['settings.reminderEnable']}
                    </label>
                </div>
                <div class="form-row">
                    <label for="reminderTime">#{msg['settings.reminderTime']}</label>
                    <h:inputText id="reminderTime" value="#{userSettingsBean.reminderTime}">
                        <f:convertDateTime type="localTime" pattern="HH:mm"/>
                    </h:inputText>
                </div>
            </div>

            <div class="card">
                <h2>#{msg['settings.security']}</h2>
                <p style="color:#5B6472;font-size:13px;margin-top:-8px;margin-bottom:16px;">
                    #{msg['settings.securityIntro']}
                </p>
                <div class="form-row">
                    <label for="currentPassword">#{msg['settings.currentPassword']}</label>
                    <h:inputSecret id="currentPassword" value="#{userSettingsBean.currentPassword}"/>
                </div>
                <div class="form-row">
                    <label for="newPassword">#{msg['settings.newPassword']}</label>
                    <h:inputSecret id="newPassword" value="#{userSettingsBean.newPassword}"/>
                </div>
                <div class="form-row">
                    <label for="newPasswordConfirmation">#{msg['settings.confirmPassword']}</label>
                    <h:inputSecret id="newPasswordConfirmation" value="#{userSettingsBean.newPasswordConfirmation}"/>
                </div>
            </div>

            <h:commandButton styleClass="btn" value="#{msg['common.save']}" action="#{userSettingsBean.save}"/>
        </h:form>

        <div class="card" style="margin-top:16px;">
            <h:form>
                <h:commandButton styleClass="btn btn-danger" value="#{msg['nav.logout']}" action="#{sessionAuth.logout}"/>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
