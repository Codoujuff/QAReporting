<ui:composition template="/WEB-INF/templates/layout.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="jakarta.faces.html"
                 xmlns:f="jakarta.faces.core"
                 xmlns:ui="jakarta.faces.facelets">

    <ui:define name="content">
        <h1>Paramètres</h1>

        <h:form>
            <div class="card">
                <h2>Compte</h2>
                <div class="form-row">
                    <label for="name">Nom</label>
                    <h:inputText id="name" value="#{userSettingsBean.user.name}" required="true"/>
                </div>
                <div class="form-row">
                    <label for="email">Email</label>
                    <h:inputText id="email" value="#{userSettingsBean.user.email}" disabled="true"/>
                </div>
            </div>

            <div class="card">
                <h2>Notifications</h2>
                <div class="form-row">
                    <label for="notifyAssigned">
                        <h:selectBooleanCheckbox id="notifyAssigned" value="#{userSettingsBean.user.notifyAssigned}"/>
                        Anomalie assignée
                    </label>
                </div>
                <div class="form-row">
                    <label for="notifyFixed">
                        <h:selectBooleanCheckbox id="notifyFixed" value="#{userSettingsBean.user.notifyFixed}"/>
                        Anomalie corrigée
                    </label>
                </div>
                <div class="form-row">
                    <label for="notifyCampaign">
                        <h:selectBooleanCheckbox id="notifyCampaign" value="#{userSettingsBean.user.notifyCampaign}"/>
                        Campagne démarrée/terminée
                    </label>
                </div>
            </div>

            <div class="card">
                <h2>Rappel de reporting</h2>
                <p style="color:#5B6472;font-size:13px;margin-top:-8px;margin-bottom:16px;">
                    Recevez une notification chaque jour pour penser à saisir votre activité.
                </p>
                <div class="form-row">
                    <label for="reminderEnabled">
                        <h:selectBooleanCheckbox id="reminderEnabled" value="#{userSettingsBean.reminderEnabled}"/>
                        Activer le rappel quotidien
                    </label>
                </div>
                <div class="form-row">
                    <label for="reminderTime">Heure du rappel (hh:mm)</label>
                    <h:inputText id="reminderTime" value="#{userSettingsBean.reminderTime}">
                        <f:convertDateTime type="localTime" pattern="HH:mm"/>
                    </h:inputText>
                </div>
            </div>

            <div class="card">
                <h2>Sécurité</h2>
                <p style="color:#5B6472;font-size:13px;margin-top:-8px;margin-bottom:16px;">
                    Laissez ces champs vides pour conserver votre mot de passe actuel.
                </p>
                <div class="form-row">
                    <label for="currentPassword">Mot de passe actuel</label>
                    <h:inputSecret id="currentPassword" value="#{userSettingsBean.currentPassword}"/>
                </div>
                <div class="form-row">
                    <label for="newPassword">Nouveau mot de passe</label>
                    <h:inputSecret id="newPassword" value="#{userSettingsBean.newPassword}"/>
                </div>
                <div class="form-row">
                    <label for="newPasswordConfirmation">Confirmer le nouveau mot de passe</label>
                    <h:inputSecret id="newPasswordConfirmation" value="#{userSettingsBean.newPasswordConfirmation}"/>
                </div>
            </div>

            <h:commandButton styleClass="btn" value="Enregistrer" action="#{userSettingsBean.save}"/>
        </h:form>

        <div class="card" style="margin-top:16px;">
            <h:form>
                <h:commandButton styleClass="btn btn-danger" value="Déconnexion" action="#{sessionAuth.logout}"/>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
