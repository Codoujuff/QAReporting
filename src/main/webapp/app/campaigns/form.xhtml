<ui:composition template="/WEB-INF/templates/layout.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="jakarta.faces.html"
                 xmlns:f="jakarta.faces.core"
                 xmlns:ui="jakarta.faces.facelets">

    <ui:define name="content">
        <h1>#{msg['campaign.new']}</h1>

        <div class="card">
            <h:form>
                <div class="form-row">
                    <label for="project">#{msg['common.project']}</label>
                    <h:selectOneMenu id="project" value="#{campaignFormBean.projectId}">
                        <f:selectItem itemLabel="#{msg['common.choose']}" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{campaignFormBean.projectOptions}" var="p"
                                       itemValue="#{p.id}" itemLabel="#{p.name}"/>
                    </h:selectOneMenu>
                </div>
                <div class="form-row">
                    <label for="name">#{msg['common.name']}</label>
                    <h:inputText id="name" value="#{campaignFormBean.campaign.name}" required="true"/>
                </div>
                <div class="form-row">
                    <label for="version">#{msg['common.version']}</label>
                    <h:inputText id="version" value="#{campaignFormBean.campaign.version}"/>
                </div>
                <div class="form-row">
                    <label for="description">#{msg['common.description']}</label>
                    <h:inputTextarea id="description" value="#{campaignFormBean.campaign.description}"/>
                </div>
                <div class="form-row">
                    <label for="environment">#{msg['common.environment']}</label>
                    <h:selectOneMenu id="environment" value="#{campaignFormBean.environmentId}">
                        <f:selectItem itemLabel="#{msg['common.noneM']}" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{campaignFormBean.environmentOptions}" var="e"
                                       itemValue="#{e.id}" itemLabel="#{e.name}"/>
                    </h:selectOneMenu>
                </div>
                <div class="form-row">
                    <label for="responsible">#{msg['common.owner']}</label>
                    <h:selectOneMenu id="responsible" value="#{campaignFormBean.responsibleId}">
                        <f:selectItem itemLabel="#{msg['common.noneM']}" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{campaignFormBean.userOptions}" var="u"
                                       itemValue="#{u.id}" itemLabel="#{u.name}"/>
                    </h:selectOneMenu>
                </div>
                <div class="form-row">
                    <label for="startDate">#{msg['campaign.startIso']}</label>
                    <h:inputText id="startDate" value="#{campaignFormBean.campaign.startDate}">
                        <f:convertDateTime type="localDate" pattern="yyyy-MM-dd"/>
                    </h:inputText>
                </div>
                <div class="form-row">
                    <label for="endDate">#{msg['campaign.endIso']}</label>
                    <h:inputText id="endDate" value="#{campaignFormBean.campaign.endDate}">
                        <f:convertDateTime type="localDate" pattern="yyyy-MM-dd"/>
                    </h:inputText>
                </div>

                <h:commandButton styleClass="btn" value="#{msg['common.save']}" action="#{campaignFormBean.save}"/>
                <h:link styleClass="btn btn-secondary" value="#{msg['common.cancel']}" outcome="/app/campaigns/list"/>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
