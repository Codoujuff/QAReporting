<ui:composition template="/WEB-INF/templates/layout.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="jakarta.faces.html"
                 xmlns:f="jakarta.faces.core"
                 xmlns:ui="jakarta.faces.facelets">

    <ui:define name="content">
        <h1>Nouvelle campagne</h1>

        <div class="card">
            <h:form>
                <div class="form-row">
                    <label for="project">Projet</label>
                    <h:selectOneMenu id="project" value="#{campaignFormBean.projectId}">
                        <f:selectItem itemLabel="-- Choisir --" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{campaignFormBean.projectOptions}" var="p"
                                       itemValue="#{p.id}" itemLabel="#{p.name}"/>
                    </h:selectOneMenu>
                </div>
                <div class="form-row">
                    <label for="name">Nom</label>
                    <h:inputText id="name" value="#{campaignFormBean.campaign.name}" required="true"/>
                </div>
                <div class="form-row">
                    <label for="version">Version</label>
                    <h:inputText id="version" value="#{campaignFormBean.campaign.version}"/>
                </div>
                <div class="form-row">
                    <label for="description">Description</label>
                    <h:inputTextarea id="description" value="#{campaignFormBean.campaign.description}"/>
                </div>
                <div class="form-row">
                    <label for="environment">Environnement</label>
                    <h:selectOneMenu id="environment" value="#{campaignFormBean.environmentId}">
                        <f:selectItem itemLabel="-- Aucun --" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{campaignFormBean.environmentOptions}" var="e"
                                       itemValue="#{e.id}" itemLabel="#{e.name}"/>
                    </h:selectOneMenu>
                </div>
                <div class="form-row">
                    <label for="responsible">Responsable</label>
                    <h:selectOneMenu id="responsible" value="#{campaignFormBean.responsibleId}">
                        <f:selectItem itemLabel="-- Aucun --" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{campaignFormBean.userOptions}" var="u"
                                       itemValue="#{u.id}" itemLabel="#{u.name}"/>
                    </h:selectOneMenu>
                </div>
                <div class="form-row">
                    <label for="startDate">Date de début (aaaa-mm-jj)</label>
                    <h:inputText id="startDate" value="#{campaignFormBean.campaign.startDate}">
                        <f:convertDateTime type="localDate" pattern="yyyy-MM-dd"/>
                    </h:inputText>
                </div>
                <div class="form-row">
                    <label for="endDate">Date de fin (aaaa-mm-jj)</label>
                    <h:inputText id="endDate" value="#{campaignFormBean.campaign.endDate}">
                        <f:convertDateTime type="localDate" pattern="yyyy-MM-dd"/>
                    </h:inputText>
                </div>

                <h:commandButton styleClass="btn" value="Enregistrer" action="#{campaignFormBean.save}"/>
                <h:link styleClass="btn btn-secondary" value="Annuler" outcome="/app/campaigns/list"/>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
