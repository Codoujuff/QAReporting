<ui:composition template="/WEB-INF/templates/layout.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="jakarta.faces.html"
                 xmlns:f="jakarta.faces.core"
                 xmlns:ui="jakarta.faces.facelets">

    <ui:define name="content">
        <h1>Nouvelle activité</h1>

        <div class="card">
            <h:form>
                <div class="form-row">
                    <label for="project">Projet</label>
                    <h:selectOneMenu id="project" value="#{activityFormBean.projectId}">
                        <f:selectItem itemLabel="-- Choisir --" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{activityFormBean.projectOptions}" var="p"
                                       itemValue="#{p.id}" itemLabel="#{p.name}"/>
                    </h:selectOneMenu>
                </div>
                <div class="form-row">
                    <label for="campaign">Campagne</label>
                    <h:selectOneMenu id="campaign" value="#{activityFormBean.campaignId}">
                        <f:selectItem itemLabel="-- Aucune --" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{activityFormBean.campaignOptions}" var="c"
                                       itemValue="#{c.id}" itemLabel="#{c.name}"/>
                    </h:selectOneMenu>
                </div>
                <div class="form-row">
                    <label for="environment">Environnement</label>
                    <h:selectOneMenu id="environment" value="#{activityFormBean.environmentId}">
                        <f:selectItem itemLabel="-- Aucun --" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{activityFormBean.environmentOptions}" var="e"
                                       itemValue="#{e.id}" itemLabel="#{e.name}"/>
                    </h:selectOneMenu>
                </div>
                <div class="form-row">
                    <label for="activityType">Type d'activité</label>
                    <h:selectOneMenu id="activityType" value="#{activityFormBean.activity.activityType}">
                        <f:selectItem itemLabel="-- Choisir --" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{activityFormBean.activityTypeOptions}"/>
                    </h:selectOneMenu>
                </div>
                <div class="form-row">
                    <label for="activityDate">Date (aaaa-mm-jj)</label>
                    <h:inputText id="activityDate" value="#{activityFormBean.activity.activityDate}">
                        <f:convertDateTime type="localDate" pattern="yyyy-MM-dd"/>
                    </h:inputText>
                </div>
                <div class="form-row">
                    <label for="testsExecuted">Tests exécutés</label>
                    <h:inputText id="testsExecuted" value="#{activityFormBean.activity.testsExecuted}"/>
                </div>
                <div class="form-row">
                    <label for="passed">Réussis</label>
                    <h:inputText id="passed" value="#{activityFormBean.activity.passed}"/>
                </div>
                <div class="form-row">
                    <label for="failed">Échoués</label>
                    <h:inputText id="failed" value="#{activityFormBean.activity.failed}"/>
                </div>
                <div class="form-row">
                    <label for="blocked">Bloqués</label>
                    <h:inputText id="blocked" value="#{activityFormBean.blockedCount}"/>
                </div>
                <div class="form-row">
                    <label for="notRun">Non exécutés</label>
                    <h:inputText id="notRun" value="#{activityFormBean.activity.notRun}"/>
                </div>
                <div class="form-row">
                    <label for="defectsCount">Anomalies trouvées</label>
                    <h:inputText id="defectsCount" value="#{activityFormBean.activity.defectsCount}"/>
                </div>
                <div class="form-row">
                    <label for="blockedReason">Motif de blocage (si des tests sont bloqués)</label>
                    <h:inputTextarea id="blockedReason" value="#{activityFormBean.activity.blockedReason}"/>
                </div>
                <div class="form-row">
                    <label for="duration">Durée</label>
                    <h:inputText id="duration" value="#{activityFormBean.activity.duration}"/>
                </div>
                <div class="form-row">
                    <label for="comment">Commentaire</label>
                    <h:inputTextarea id="comment" value="#{activityFormBean.activity.comment}"/>
                </div>

                <h:commandButton styleClass="btn" value="Enregistrer" action="#{activityFormBean.save}"/>
                <h:link styleClass="btn btn-secondary" value="Annuler" outcome="/app/activity/list"/>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
