<ui:composition template="/WEB-INF/templates/layout.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="jakarta.faces.html"
                 xmlns:f="jakarta.faces.core"
                 xmlns:ui="jakarta.faces.facelets">

    <ui:define name="content">
        <div class="actions-bar">
            <h1>#{msg['nav.appSettings']}</h1>
            <h:link styleClass="btn" value="#{msg['setting.new']}" outcome="/app/admin/settings/form"/>
        </div>

        <div class="card">
            <h:dataTable value="#{appSettingListBean.settings}" var="s" styleClass="data-table">
                <h:column>
                    <f:facet name="header">#{msg['setting.key']}</f:facet>
                    #{s.settingKey}
                </h:column>
                <h:column>
                    <f:facet name="header">#{msg['setting.value']}</f:facet>
                    #{s.settingValue}
                </h:column>
                <h:column>
                    <f:facet name="header">#{msg['common.description']}</f:facet>
                    #{s.description}
                </h:column>
                <h:column>
                    <f:facet name="header">#{msg['common.actions']}</f:facet>
                    <div class="table-actions">
                        <h:link styleClass="btn btn-secondary" value="#{msg['common.edit']}" outcome="/app/admin/settings/form">
                            <f:param name="id" value="#{s.id}"/>
                        </h:link>
                        <h:form style="display:inline">
                            <h:commandButton styleClass="btn btn-danger" value="#{msg['common.delete']}"
                                             action="#{appSettingListBean.delete(s)}"
                                             onclick="return confirm('#{msg['setting.deleteConfirm']}');"/>
                        </h:form>
                    </div>
                </h:column>
            </h:dataTable>

            <h:panelGroup rendered="#{empty appSettingListBean.settings}">
                <p style="color:#5B6472;font-size:13px;">#{msg['setting.none']}</p>
            </h:panelGroup>
        </div>
    </ui:define>
</ui:composition>
