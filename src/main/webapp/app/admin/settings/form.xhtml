<ui:composition template="/WEB-INF/templates/layout.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="jakarta.faces.html"
                 xmlns:f="jakarta.faces.core"
                 xmlns:ui="jakarta.faces.facelets">

    <f:metadata>
        <f:viewParam name="id" value="#{appSettingFormBean.id}"/>
        <f:viewAction action="#{appSettingFormBean.load}"/>
    </f:metadata>

    <ui:define name="content">
        <h1>#{appSettingFormBean.id != null ? 'Modifier le réglage' : 'Nouveau réglage'}</h1>

        <div class="card">
            <h:form>
                <div class="form-row">
                    <label for="settingKey">Clé</label>
                    <h:inputText id="settingKey" value="#{appSettingFormBean.setting.settingKey}" required="true"/>
                </div>
                <div class="form-row">
                    <label for="settingValue">Valeur</label>
                    <h:inputTextarea id="settingValue" value="#{appSettingFormBean.setting.settingValue}"/>
                </div>
                <div class="form-row">
                    <label for="description">Description</label>
                    <h:inputTextarea id="description" value="#{appSettingFormBean.setting.description}"/>
                </div>
                <h:commandButton styleClass="btn" value="Enregistrer" action="#{appSettingFormBean.save}"/>
                <h:link styleClass="btn btn-secondary" value="Annuler" outcome="/app/admin/settings/list"/>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
