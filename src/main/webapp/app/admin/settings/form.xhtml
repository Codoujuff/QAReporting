<ui:composition template="/WEB-INF/templates/layout.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="jakarta.faces.html"
                 xmlns:f="jakarta.faces.core"
                 xmlns:ui="jakarta.faces.facelets">

    <f:metadata>
        <f:viewParam name="id" value="#{appSettingFormBean.id}"/>
        <f:viewAction action="#{appSettingFormBean.load}"/>
    </f:metadata>

    <ui:define name="content">
        <h1>#{appSettingFormBean.id != null ? msg['setting.edit'] : msg['setting.new']}</h1>

        <div class="card">
            <h:form>
                <div class="form-row">
                    <h:outputLabel for="settingKey" value="#{msg['setting.key']}"/>
                    <h:inputText id="settingKey" value="#{appSettingFormBean.setting.settingKey}" required="true"/>
                </div>
                <div class="form-row">
                    <h:outputLabel for="settingValue" value="#{msg['setting.value']}"/>
                    <h:inputTextarea id="settingValue" value="#{appSettingFormBean.setting.settingValue}"/>
                </div>
                <div class="form-row">
                    <h:outputLabel for="description" value="#{msg['common.description']}"/>
                    <h:inputTextarea id="description" value="#{appSettingFormBean.setting.description}"/>
                </div>
                <h:commandButton styleClass="btn" value="#{msg['common.save']}" action="#{appSettingFormBean.save}"/>
                <h:link styleClass="btn btn-secondary" value="#{msg['common.cancel']}" outcome="/app/admin/settings/list"/>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
