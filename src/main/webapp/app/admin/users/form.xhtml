<ui:composition template="/WEB-INF/templates/layout.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="jakarta.faces.html"
                 xmlns:f="jakarta.faces.core"
                 xmlns:ui="jakarta.faces.facelets">

    <f:metadata>
        <f:viewParam name="id" value="#{userFormBean.id}"/>
        <f:viewAction action="#{userFormBean.load}"/>
    </f:metadata>

    <ui:define name="content">
        <h1>#{userFormBean.id != null ? msg['user.edit'] : msg['user.new']}</h1>

        <div class="card">
            <h:form>
                <div class="form-row">
                    <h:outputLabel for="name" value="#{msg['common.name']}"/>
                    <h:inputText id="name" value="#{userFormBean.user.name}" required="true"/>
                </div>
                <div class="form-row">
                    <h:outputLabel for="initials" value="#{msg['user.initials']}"/>
                    <h:inputText id="initials" value="#{userFormBean.user.initials}"/>
                </div>
                <div class="form-row">
                    <h:outputLabel for="email" value="#{msg['common.email']}"/>
                    <h:inputText id="email" value="#{userFormBean.user.email}"
                                 required="true" disabled="#{userFormBean.id != null}"/>
                </div>
                <div class="form-row">
                    <h:outputLabel for="password" value="#{userFormBean.id != null ? msg['user.newPassword'] : msg['common.password']}"/>
                    <h:inputSecret id="password" value="#{userFormBean.password}"/>
                    <span class="field-hint">#{msg['user.passwordHint']}</span>
                </div>
                <div class="form-row">
                    <h:outputLabel for="role" value="#{msg['common.role']}"/>
                    <h:selectOneMenu id="role" value="#{userFormBean.roleId}">
                        <f:selectItem itemLabel="#{msg['common.choose']}" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{userFormBean.roleOptions}" var="r"
                                       itemValue="#{r.id}" itemLabel="#{labels.role(r.name)}"/>
                    </h:selectOneMenu>
                </div>
                <div class="form-row">
                    <h:outputLabel for="team" value="#{msg['common.team']}"/>
                    <h:selectOneMenu id="team" value="#{userFormBean.teamId}">
                        <f:selectItem itemLabel="#{msg['common.noneF']}" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{userFormBean.teamOptions}" var="t"
                                       itemValue="#{t.id}" itemLabel="#{t.name}"/>
                    </h:selectOneMenu>
                </div>
                <div class="form-row">
                    <h:outputLabel for="active"><h:selectBooleanCheckbox id="active" value="#{userFormBean.user.active}"/>
                        #{msg['user.activeAccount']}</h:outputLabel>
                </div>
                <h:commandButton styleClass="btn" value="#{msg['common.save']}" action="#{userFormBean.save}"/>
                <h:link styleClass="btn btn-secondary" value="#{msg['common.cancel']}" outcome="/app/admin/users/list"/>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
