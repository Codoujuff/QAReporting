<ui:composition template="/WEB-INF/templates/layout.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="jakarta.faces.html"
                 xmlns:f="jakarta.faces.core"
                 xmlns:ui="jakarta.faces.facelets">

    <f:metadata>
        <f:viewParam name="id" value="#{environmentFormBean.id}"/>
        <f:viewAction action="#{environmentFormBean.load}"/>
    </f:metadata>

    <ui:define name="content">
        <h1>#{environmentFormBean.id != null ? msg['env.edit'] : msg['env.new']}</h1>

        <div class="card">
            <h:form>
                <div class="form-row">
                    <label for="name">#{msg['common.name']}</label>
                    <h:inputText id="name" value="#{environmentFormBean.environment.name}" required="true"/>
                </div>
                <div class="form-row">
                    <label for="description">#{msg['common.description']}</label>
                    <h:inputTextarea id="description" value="#{environmentFormBean.environment.description}"/>
                </div>
                <div class="form-row">
                    <label for="url">#{msg['common.url']}</label>
                    <h:inputText id="url" value="#{environmentFormBean.environment.url}"/>
                </div>
                <div class="form-row">
                    <label for="status">#{msg['common.status']}</label>
                    <h:selectOneMenu id="status" value="#{environmentFormBean.environment.status}">
                        <f:selectItems value="#{environmentFormBean.statusOptions}" var="o" itemValue="#{o}" itemLabel="#{labels.of(o)}"/>
                    </h:selectOneMenu>
                </div>
                <h:commandButton styleClass="btn" value="#{msg['common.save']}" action="#{environmentFormBean.save}"/>
                <h:link styleClass="btn btn-secondary" value="#{msg['common.cancel']}" outcome="/app/admin/environments/list"/>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
