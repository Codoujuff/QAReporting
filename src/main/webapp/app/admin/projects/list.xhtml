<ui:composition template="/WEB-INF/templates/layout.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="jakarta.faces.html"
                 xmlns:f="jakarta.faces.core"
                 xmlns:ui="jakarta.faces.facelets">

    <ui:define name="content">
        <div class="actions-bar">
            <h1>#{msg['common.projects']}</h1>
            <h:link styleClass="btn" value="#{msg['project.new']}" outcome="/app/admin/projects/form"/>
        </div>

        <div class="card">
            <h:dataTable value="#{projectListBean.projects}" var="p" styleClass="data-table">
                <h:column>
                    <f:facet name="header">#{msg['common.name']}</f:facet>
                    #{p.name}
                </h:column>
                <h:column>
                    <f:facet name="header">#{msg['common.status']}</f:facet>
                    <span class="badge status-#{p.status}"><span class="dot"></span>#{labels.of(p.status)}</span>
                </h:column>
                <h:column>
                    <f:facet name="header">#{msg['common.team']}</f:facet>
                    #{p.team != null ? p.team.name : '—'}
                </h:column>
                <h:column>
                    <f:facet name="header">#{msg['common.actions']}</f:facet>
                    <div class="table-actions">
                        <h:link styleClass="btn btn-secondary" value="#{msg['common.edit']}" outcome="/app/admin/projects/form">
                            <f:param name="id" value="#{p.id}"/>
                        </h:link>
                        <h:form styleClass="inline-form">
                            <h:commandButton styleClass="btn btn-danger" value="#{msg['common.delete']}"
                                             action="#{projectListBean.delete(p)}"
                                             onclick="return confirm('#{msg['project.deleteConfirm']}');"/>
                        </h:form>
                    </div>
                </h:column>
            </h:dataTable>
        </div>
    </ui:define>
</ui:composition>
