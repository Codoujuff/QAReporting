<ui:composition template="/WEB-INF/templates/layout.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="jakarta.faces.html"
                 xmlns:f="jakarta.faces.core"
                 xmlns:ui="jakarta.faces.facelets">

    <f:metadata>
        <f:viewParam name="id" value="#{projectFormBean.id}"/>
        <f:viewAction action="#{projectFormBean.load}"/>
    </f:metadata>

    <ui:define name="content">
        <h1>#{projectFormBean.id != null ? msg['project.edit'] : msg['project.new']}</h1>

        <div class="card">
            <h:form>
                <div class="form-row">
                    <h:outputLabel for="name" value="#{msg['common.name']}"/>
                    <h:inputText id="name" value="#{projectFormBean.project.name}" required="true"/>
                </div>
                <div class="form-row">
                    <h:outputLabel for="description" value="#{msg['common.description']}"/>
                    <h:inputTextarea id="description" value="#{projectFormBean.project.description}"/>
                </div>
                <div class="form-row">
                    <h:outputLabel for="status" value="#{msg['common.status']}"/>
                    <h:selectOneMenu id="status" value="#{projectFormBean.project.status}">
                        <f:selectItems value="#{projectFormBean.statusOptions}" var="o" itemValue="#{o}" itemLabel="#{labels.of(o)}"/>
                    </h:selectOneMenu>
                </div>
                <div class="form-row">
                    <h:outputLabel for="team" value="#{msg['common.team']}"/>
                    <h:selectOneMenu id="team" value="#{projectFormBean.teamId}">
                        <f:selectItem itemLabel="#{msg['common.noneF']}" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{projectFormBean.teamOptions}" var="t"
                                       itemValue="#{t.id}" itemLabel="#{t.name}"/>
                    </h:selectOneMenu>
                </div>
                <div class="form-row">
                    <span class="form-row-label">#{msg['project.members']}</span>
                    <span class="field-hint">#{msg['project.membersHint']}</span>
                    <h:selectManyCheckbox id="members" value="#{projectFormBean.memberIds}" layout="pageDirection"
                                          styleClass="member-checks">
                        <f:converter converterId="jakarta.faces.Long"/>
                        <f:selectItems value="#{projectFormBean.memberOptions}" var="u" itemValue="#{u.id}"
                                       itemLabel="#{u.name} — #{labels.role(u.role.name)}#{u.team != null ? ' · '.concat(u.team.name) : ''}"/>
                    </h:selectManyCheckbox>
                </div>
                <h:commandButton styleClass="btn" value="#{msg['common.save']}" action="#{projectFormBean.save}"/>
                <h:link styleClass="btn btn-secondary" value="#{msg['common.cancel']}" outcome="/app/admin/projects/list"/>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
