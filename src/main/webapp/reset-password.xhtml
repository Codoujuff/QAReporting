<ui:composition template="/WEB-INF/templates/layout.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="jakarta.faces.html"
                 xmlns:f="jakarta.faces.core"
                 xmlns:ui="jakarta.faces.facelets">

    <f:metadata>
        <f:viewParam name="token" value="#{passwordResetBean.token}"/>
    </f:metadata>

    <ui:define name="content">
        <div class="login-wrapper">
            <div class="card login-card">
                <div class="login-brand">
                    <span class="brand-dot"></span>
                    <span class="login-brand-name">#{msg['app.name']}</span>
                </div>
                <h1>#{msg['reset.newTitle']}</h1>
                <h:panelGroup rendered="#{passwordResetBean.tokenValid}">
                    <h:form>
                        <div class="form-row">
                            <h:outputLabel for="password" value="#{msg['settings.newPassword']}"/>
                            <h:inputSecret id="password" value="#{passwordResetBean.password}" required="true"/>
                            <span class="field-hint">#{msg['settings.passwordRule']}</span>
                        </div>
                        <div class="form-row">
                            <h:outputLabel for="confirmation" value="#{msg['settings.confirmPassword']}"/>
                            <h:inputSecret id="confirmation" value="#{passwordResetBean.confirmation}" required="true"/>
                        </div>
                        <h:commandButton styleClass="btn" value="#{msg['common.save']}" action="#{passwordResetBean.reset}"/>
                    </h:form>
                </h:panelGroup>
                <h:panelGroup rendered="#{not passwordResetBean.tokenValid}">
                    <p class="subtitle">#{msg['err.resetLinkInvalid']}</p>
                    <h:link styleClass="btn" value="#{msg['reset.askAgain']}" outcome="/forgot-password"/>
                </h:panelGroup>
            </div>
        </div>
    </ui:define>
</ui:composition>
